<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NOVA — Voice Assistant</title>
  <meta name="description" content="NOVA — a natural real-time personal voice assistant.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      background:
        radial-gradient(circle at 20% 20%, #173b70 0%, transparent 35%),
        radial-gradient(circle at 80% 80%, #30165f 0%, transparent 35%),
        #050711;
      overflow-x: hidden;
    }

    .background {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .orb {
      position: absolute;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      filter: blur(90px);
      opacity: .35;
      animation: float 8s ease-in-out infinite;
    }

    .orb.one {
      background: #00d9ff;
      left: -100px;
      top: 10%;
    }

    .orb.two {
      background: #7c3cff;
      right: -100px;
      bottom: 5%;
      animation-delay: -4s;
    }

    @keyframes float {
      0%,100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-40px) scale(1.15); }
    }

    header {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 6%;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 22px;
      letter-spacing: 2px;
    }

    .logo-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #00e5ff;
      box-shadow: 0 0 20px #00e5ff;
    }

    .status {
      padding: 9px 15px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 999px;
      background: rgba(255,255,255,.06);
      backdrop-filter: blur(15px);
      color: #b8faff;
      font-size: 13px;
    }

    main {
      position: relative;
      z-index: 2;
      min-height: calc(100vh - 80px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px 20px 120px;
    }

    .badge {
      display: inline-block;
      padding: 8px 15px;
      margin-bottom: 20px;
      border: 1px solid rgba(0,229,255,.25);
      border-radius: 999px;
      color: #9df8ff;
      background: rgba(0,229,255,.06);
      font-size: 13px;
    }

    h1 {
      font-size: clamp(55px, 13vw, 120px);
      line-height: .9;
      letter-spacing: -5px;
      background: linear-gradient(120deg, #ffffff, #9eefff, #9b7cff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 25px;
    }

      max-width: 650px;
      color: #aeb5c9;

      line-height: 1.
